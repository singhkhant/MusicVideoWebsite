<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>My Favorite Song</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <h1>My Favorite Music Video</h1>
    <p>Enjoy the song and click the button below to see the JavaScript animation!</p>

    <!-- Embedded YouTube Video -->
    <div class="video-container">
        <iframe width="560" height="315" 
         src="https://www.youtube.com/embed/HCKHmBBV0Zo?si=4FwQ4HOnwjDAQ01O" 
         title="YouTube video player" frameborder="0" 
         allow="accelerometer; autoplay; clipboard-write; encrypted-media; 
         gyroscope; picture-in-picture; 
         web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
        </iframe>
    </div>

    <!-- W3Schools Style JS Animation -->
    <p><button onclick="myMove()">Click Me to Animate</button></p>

    <div id="myContainer">
        <div id="myAnimation"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
